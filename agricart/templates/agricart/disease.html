{% extends 'agricart/layouts/main.html' %}
{% load static %}
{% block content %}

<div class="container-fluid" style="margin-top:70px;min-height:620px;">
    <div class="row">
        <div class="col-12">
            <h4>Paddy Disease</h4>
            <hr>
            {% include 'agricart/inc/message.html' %}
        </div>
    </div>

    <div class="content-wrapper">
        <h1>Find out which disease has affected the paddy crop</h1>

        <h4 style="margin-top: 50px;margin-right: 70px;">Upload The Image Here</h4>

        <form method="POST" enctype="multipart/form-data" action="{% url 'disease' %}">
            {% csrf_token %}

            <!-- File input -->
            <input type="file" name="image" id="imageInput" accept="image/*" required>

            <!-- Image preview javascript -->
            <img id="previewImage" alt="Selected Image Preview">

            <button type="submit">Predict</button>
        </form>
    </div>

<style>
body {
  background: linear-gradient(135deg, #4b6cb7, #182848);
  height: 100vh;
  background-attachment: fixed;
  background-size: cover;
  color: #fff;
}

h4 {
  text-align: center;
  color: #fff;
  font-weight: 600;
  margin-bottom: 25px;
}

.content-wrapper {
    min-height: calc(80vh - 150px);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

input[type=file] {
    margin: 20px auto;
    display: block;
}

button {
    display: block;
    margin-top: 30px;
    background-image: linear-gradient(45deg, #00c6ff, #0072ff);
    padding: 10px 120px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s ease;
}

button:hover {
    background-image: linear-gradient(45deg, #0072ff, #00c6ff);
    transform: translateY(-2px);
}

/* Preview image */
#previewImage {
    display: none;
    margin-top: 20px;
    width: 300px;
    height: 300px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
}

form {
    margin-bottom: 90px;
}

</style>
</div>

<script src="{% static 'js/script.js' %}"></script>

{% endblock content %}
